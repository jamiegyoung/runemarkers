name: link-check

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '0 18 * * 1'

permissions:
  contents: read

env:
  GO_VERSION: '1.24'

jobs:
  entity-links:
    runs-on: ubuntu-latest
    # Only the scheduled run fails, as it has no pull request to report on
    continue-on-error: ${{ github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Check entity links
        # count=1 because a cached pass would never contact a single host
        run: go test ./internal/links/ -count=1 -v -timeout 10m
